name: Deploy ZCC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Vite build
        run: |
          set +e
          npx vite build >vite.log 2>&1
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            MSG=$(tail -c 1800 vite.log | tr '\n' '|' | tr -d '\r' | sed 's/::/-/g; s/\r//g')
            echo "::error::VITE_BUILD_FAIL exit=$CODE :: $MSG"
            exit $CODE
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
